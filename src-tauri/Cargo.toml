[package]
name = "solix"
version = "2.0.1"
description = "Configure seu Linux de forma simples e rápida"
authors = ["Rafael do Carmo Costa"]
edition = "2021"

[lib]
name = "solix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process"] }
